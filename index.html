<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Moonshot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-row">

    <!-- LEFT: rotate left -->
    <div class="side-ctrl left-ctrl">
      <button class="orient-btn" id="btn-prograde"  aria-label="Prograde"  title="Prograde (E)">PRO</button>
      <button class="move-btn rotate-btn" id="btn-left" aria-label="Rotate left">◁</button>
      <button class="orient-btn" id="btn-retrograde" aria-label="Retrograde" title="Retrograde (Q)">RETRO</button>
      <button class="side-extra-btn" id="btn-warp-cycle" aria-label="Warp">1×</button>
    </div>

    <!-- CENTRE: canvas + overlay -->
    <div class="game-shell">
      <canvas id="game" width="2400" height="1600"></canvas>
      <button class="fullscreen-btn" id="btn-fullscreen" aria-label="Fullscreen">⛶</button>
      <button class="menu-btn" id="btn-menu" aria-label="Menu">☰</button>
    </div>

    <!-- RIGHT: thrust (top) + rotate right (bottom) -->
    <div class="side-ctrl right-ctrl">
      <button class="move-btn thrust-btn" id="btn-thrust" aria-label="Thrust">▲<br><span>THRUST</span></button>
      <button class="move-btn rotate-btn" id="btn-right" aria-label="Rotate right">▷</button>
      <button class="side-extra-btn restart-side-btn" id="btn-restart" aria-label="Restart">↺</button>
    </div>

  </div>

  <!-- Hidden warp buttons kept for keyboard sync only -->
  <div class="warp-btns" style="display:none">
    <button class="warp-btn active" id="btn-warp-1">1×</button>
    <button class="warp-btn"        id="btn-warp-2">2×</button>
    <button class="warp-btn"        id="btn-warp-3">3×</button>
    <button class="warp-btn"        id="btn-warp-4">5×</button>
  </div>

  <div class="portrait-hint">
    <div class="portrait-hint-inner">
      <div class="portrait-hint-icon">⟳</div>
      <div>Rotate your device</div>
    </div>
  </div>
  <audio id="bg-music" loop preload="auto">
    <source src="audio/Rocket.mp3" type="audio/mpeg">
  </audio>
  <script src="game.js"></script>
</body>
</html>
